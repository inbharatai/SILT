[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-skill-extraction-adapter"
version = "0.1.0"
description = "SILT (Skill Interchange Layer with Trust-gating): a universal, local-first adapter for controlled AI-to-AI skill transfer with evaluation-gated promotion. Imports as asea."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 3 - Pre-Alpha",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
studio = ["fastapi>=0.100", "uvicorn>=0.23"]
# Not installed here and not required by the MVP. These are what a real
# connector would need; see docs/connector_authoring.md.
connectors = [
    "transformers>=4.40",
    "torch>=2.0",
    "sentence-transformers>=2.2",
]
# Deep-apply (native gated LoRA trainer). Optional and heavy -- the deepapply
# package imports without it; the real trainer backends raise a named
# DeepApplyBlocked error naming this extra if it is absent. Small models
# (e.g. SmolLM2-135M) train on CPU; larger models need CUDA.
deep = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.25",
    "sentencepiece>=0.1.99",
]

# Experimental local-only runtime; never installed by the core or Studio extras.
# CPU users should install the CPU torch wheel explicitly before this extra.
localmodels = [
    "torch>=2.6,<2.7",
    "transformers==4.51.3",
    "accelerate>=0.26,<2",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2",
    "scipy>=1.10",
    "soundfile>=0.12",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://silt.inbharat.ai"
Documentation = "https://github.com/inbharatai/SILT#readme"
Source = "https://github.com/inbharatai/SILT"
Issues = "https://github.com/inbharatai/SILT/issues"
"Patent notice" = "https://github.com/inbharatai/SILT/blob/main/PATENT.md"
"SILT Studio" = "https://silt.inbharat.ai/studio/"

[project.scripts]
asea = "asea.cli:main"
silt-studio = "asea.studio.launcher:main"
silt-compose = "asea.compose.__main__:main"
silt-compile = "asea.compiler.__main__:main"
silt-artifacts = "asea.artifacts.__main__:main"
silt-validate = "asea.validation.__main__:main"
silt-execution = "asea.execution.__main__:main"
silt-specialist = "asea.specialist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]