name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + dev + studio extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,studio]"

      - name: Run offline test suite
        env:
          # Never set ASEA_RUN_REAL in CI — keeps runs offline and deterministic.
          ASEA_RUN_REAL: ""
        run: pytest -q

  lint-check:
    name: sanity (imports clean, no real-weight escape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core package imports without optional extras
        run: python -c "import asea; print('asea', asea.__version__)"
      - name: No 'bypass' parameter sneaked onto a gate
        run: |
          ! grep -rn "def .*bypass" src/asea/promotion src/asea/deepapply || { echo "FAIL: bypass argument found on a gate"; exit 1; }