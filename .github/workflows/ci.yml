name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned CPU engineering test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"
          python -m pip install -c requirements-ci-cpu.txt -r requirements-ci-cpu.txt -e ".[dev,studio,localmodels,deep]"
          python -m playwright install --with-deps chromium

      - name: Run offline test suite
        env:
          # Never set ASEA_RUN_REAL in CI — keeps runs offline and deterministic.
          ASEA_RUN_REAL: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        # `python -m pytest` (not bare `pytest`) so the `tests` package is
        # importable for cross-test fixtures (e.g. tests.conftest, tests.test_promotion_gate).
        run: python -m pytest -q

  lint-check:
    name: sanity (imports clean, no real-weight escape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core package imports without optional extras
        run: python -c "import asea; print('asea', asea.__version__)"
      - name: No 'bypass' parameter sneaked onto a gate
        run: |
          ! grep -rn "def .*bypass" src/asea/promotion src/asea/deepapply || { echo "FAIL: bypass argument found on a gate"; exit 1; }